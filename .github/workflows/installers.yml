name: Build installers

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-amd64
            os: ubuntu-22.04
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev desktop-file-utils xvfb
      - name: Version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match Cargo.toml version" >&2
            exit 1
          fi
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Linux startup smoke test
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          status=0
          xvfb-run -a timeout 10s target/release/kiniwolf-browser > startup.log 2>&1 || status=$?
          if [ "$status" -ne 124 ]; then
            cat startup.log
            echo "Browser exited before the startup test completed (status $status)" >&2
            exit 1
          fi
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh "$APP_VERSION"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash packaging/macos/package.sh "$APP_VERSION"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile dist/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature dist/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid WebView2 bootstrapper signature' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Remove-Item -LiteralPath dist/MicrosoftEdgeWebview2Setup.exe
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for file in *.exe *.dmg *.deb; do
            [ -f "$file" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi
          done > "SHA256SUMS-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Kiniwolf-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Kiniwolf $GITHUB_REF_NAME" --notes "Windows x64 setup, Linux amd64 DEB (Ubuntu 22.04+), and macOS Intel/Apple Silicon DMGs. Windows setup installs WebView2 if needed (internet required). Builds are not signed with a publisher certificate or notarized by Apple. Native password saving is currently available on Windows only. SHA-256 checksums are included."
